name: Free macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build free ad-hoc release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}" scripts/package_release.sh

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslateBuddy-free-macOS-arm64
          path: |
            releases/LiveTranslateBuddy-macOS-arm64.dmg
            releases/LiveTranslateBuddy-macOS-arm64.zip
            releases/LiveTranslateBuddy-macOS-arm64.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            releases/LiveTranslateBuddy-macOS-arm64.dmg \
            releases/LiveTranslateBuddy-macOS-arm64.zip \
            releases/LiveTranslateBuddy-macOS-arm64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Live Translate Buddy $GITHUB_REF_NAME" \
            --notes "Free ad-hoc signed macOS build. If macOS warns about an unidentified developer, Right-click the app and choose Open once."
